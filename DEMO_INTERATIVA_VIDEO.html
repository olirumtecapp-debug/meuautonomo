  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .story-progress-bg {
      background: rgba(255, 255, 255, 0.25);
    }
    .story-progress-fill {
      background: #d9f56a;
      transition: width 0.1s linear;
    }
    .phone-shadow {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }
    .pulse-tap {
      animation: tap-pulse 1.2s infinite;
    }
    @keyframes tap-pulse {
      0% { transform: scale(0.9); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 0.4; }
      100% { transform: scale(0.9); opacity: 0.9; }
    }
    .badge-pop {
      animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes pop-in {
      0% { transform: scale(0.8) translateY(10px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
  </style>
</head>

    let currentSlide = 0;
    let isPlaying = true;
    let isInteractive = false;
    let slideTimer = null;
    let progressTimer = null;
    let progressPct = 0;
    const SLIDE_DURATION = 6000; // 6 segundos por slide

    // INICIALIZAÇÃO
    function init() {
      renderProgressBars();
      showSlide(0);
      startSlideTimer();
    }

    // GERA AS BARRINHAS DE PROGRESSO NO TOPO
    function renderProgressBars() {
      const container = document.getElementById("progressBars");
      container.innerHTML = "";
      slides.forEach((_, i) => {
        const bar = document.createElement("div");
        bar.className = "flex-1 h-1.5 rounded-full story-progress-bg overflow-hidden relative cursor-pointer";
        bar.onclick = () => goToSlide(i);
        bar.innerHTML = `<div id="fill-${i}" class="h-full story-progress-fill w-0"></div>`;
        container.appendChild(bar);
      });
    }

    // EXIBE O SLIDE ATUAL
    function showSlide(index) {
      currentSlide = index;
      const slide = slides[currentSlide];

      // Atualiza contador
      document.getElementById("slideCounter").innerText = `Vantagem ${currentSlide + 1} de ${slides.length}`;

      // Atualiza barrinhas de progresso
      slides.forEach((_, i) => {
        const fill = document.getElementById(`fill-${i}`);
        if (i < currentSlide) {
          fill.style.width = "100%";
        } else if (i === currentSlide) {
          fill.style.width = `${progressPct}%`;
        } else {
          fill.style.width = "0%";
        }
      });

      // Atualiza o conteúdo visual
      const container = document.getElementById("slideContainer");
      container.innerHTML = `
        <div class="badge-pop mb-3 text-center">
          <span class="text-[10px] font-black uppercase tracking-widest text-[#d9f56a] bg-[#d9f56a]/15 px-3 py-1 rounded-full border border-[#d9f56a]/30">
            ${slide.subtitle}
          </span>
          <h2 class="text-xl sm:text-2xl font-black text-white mt-2 leading-tight">
            ${slide.title}
          </h2>
          <p class="text-xs text-white/70 mt-1 max-w-xs mx-auto">
            ${slide.description}
          </p>
        </div>

        <div class="my-auto">
          ${slide.screenHtml}
        </div>
      `;

      // Atualiza o card de vantagem no rodapé
      const badge = document.getElementById("advantageBadge");
      badge.innerHTML = `
        <div class="text-xs font-black text-[#d9f56a] uppercase tracking-wide flex items-center gap-1.5">
          ${slide.advantageTitle}
        </div>
        <div class="text-xs text-white/90 font-medium mt-0.5">
          ${slide.advantageText}
        </div>
      `;

      // Atualiza texto do botão
      document.getElementById("btnActionText").innerText = slide.buttonText;
    }

    // CONTROLE DE TEMPO (AUTO-PLAY)
    function startSlideTimer() {
      if (!isPlaying || isInteractive) return;
      clearInterval(slideTimer);
      clearInterval(progressTimer);

      const intervalMs = 50;
      const stepPct = (intervalMs / SLIDE_DURATION) * 100;

      progressTimer = setInterval(() => {
        progressPct += stepPct;
        const fill = document.getElementById(`fill-${currentSlide}`);
        if (fill) fill.style.width = `${Math.min(100, progressPct)}%`;

        if (progressPct >= 100) {
          progressPct = 0;
          nextSlide();
        }
      }, intervalMs);
    }

    function stopSlideTimer() {
      clearInterval(slideTimer);
      clearInterval(progressTimer);
    }

    function nextSlide() {
      progressPct = 0;
      if (currentSlide < slides.length - 1) {
        showSlide(currentSlide + 1);
      } else {
        showSlide(0); // Faz loop para recomeçar
      }
    }

    function prevSlide() {
      progressPct = 0;
      if (currentSlide > 0) {
        showSlide(currentSlide - 1);
      } else {
        showSlide(slides.length - 1);
      }
    }

    function goToSlide(i) {
      progressPct = 0;
      showSlide(i);
    }

    function togglePlayPause() {
      isPlaying = !isPlaying;
      const btn = document.getElementById("btnPlayPause");
      if (isPlaying) {
        btn.innerText = "⏸️";
        startSlideTimer();
      } else {
        btn.innerText = "▶️";
        stopSlideTimer();
      }
    }

    function toggleInteractiveMode() {
      isInteractive = !isInteractive;
      const btn = document.getElementById("btnMode");
      if (isInteractive) {
        stopSlideTimer();
        isPlaying = false;
        document.getElementById("btnPlayPause").innerText = "▶️";
        btn.innerText = "▶️ Voltar ao Vídeo";
        btn.className = "px-2.5 py-1 rounded-full bg-white text-slate-900 font-black text-xs shadow active:scale-95 transition";
      } else {
        isPlaying = true;
        document.getElementById("btnPlayPause").innerText = "⏸️";
        btn.innerText = "🎮 Mexer com o dedo";
        btn.className = "px-2.5 py-1 rounded-full bg-[#d9f56a] text-[#173a34] font-black text-xs shadow active:scale-95 transition";
        startSlideTimer();
      }
    }

    function handleActionClick() {
      if (currentSlide === slides.length - 1) {
        // Redireciona para o WhatsApp do usuário ou abre o app
        window.location.href = "/app";
      } else {
        nextSlide();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
